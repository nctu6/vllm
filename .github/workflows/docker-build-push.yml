name: Build and Push Docker Image (NVIDIA)

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: |
            docker/docker-bake.hcl
            docker/versions.json
          targets: openai
          push: true
          set: |
            openai.tags=${{ env.DOCKERHUB_REPO }}:latest
            openai.tags=${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.sha_short }}
            openai.tags=${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.date }}
