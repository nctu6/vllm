name: Build and Push Docker Image (NVIDIA)

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          TORCH_CUDA_ARCH_LIST: "9.0 10.0 11.0 12.0"
        with:
          source: .
          files: |
            docker/docker-bake.hcl
            docker/versions.json
          targets: openai
          push: true
          set: |
            openai.tags=${{ env.DOCKERHUB_REPO }}:latest
            openai.tags=${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.sha_short }}
            openai.tags=${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.date }}
