name: Build and Push Docker Image (NVIDIA)

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  build-and-push:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_date=$(git rev-parse --short HEAD)-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          TORCH_CUDA_ARCH_LIST: "9.0 10.0 11.0 12.0"
          MAX_JOBS: "64"
          NVCC_THREADS: "4"
        with:
          source: .
          files: |
            docker/docker-bake.hcl
            docker/versions.json
          targets: openai
          push: false
          load: true
          set: |
            openai.tags=vllm-base:local
            *.args.max_jobs=64
            *.args.nvcc_threads=4
            *.args.RUN_WHEEL_CHECK=false

      - name: Install extra packages and push
        run: |
          cat <<'EOF' | docker build -t ${{ env.DOCKERHUB_REPO }}:latest -
          FROM vllm-base:local
          RUN pip install --no-cache-dir "vllm[audio]" msgpack
          EOF
          docker tag ${{ env.DOCKERHUB_REPO }}:latest ${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.sha_date }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest
          docker push ${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.sha_date }}

      - name: Run PyArmor and push secure image
        id: pyarmor
        continue-on-error: true
        run: |
          bash /workspace/nctu6/autobuild/autobuild-service/pyarmor-tools/run_pyarmor.sh \
            "${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.sha_date }}" \
            "nctu6/unieinfra-build-secure"

      - name: Sync image names to Notion
        if: always()
        continue-on-error: true
        env:
          TORCH_CUDA_ARCH_LIST: "9.0 10.0 11.0 12.0"
          CUDA_VERSION: "13.0.3"
        run: |
          TAG="${{ steps.meta.outputs.sha_date }}"
          SOURCE_IMAGE="${{ env.DOCKERHUB_REPO }}:${TAG}"
          PYARMOR_IMAGE="nctu6/unieinfra-build-secure:${TAG}"
          # "9.0 10.0 11.0 12.0" -> "9,10,11,12"
          CUDA_ARCH=$(echo "${TORCH_CUDA_ARCH_LIST}" | tr ' ' '\n' | sed 's/\..*//' | paste -sd ',' -)
          CODE=$(git log -1 --pretty=%s)
          bash /workspace/nctu6/autobuild/autobuild-service/pyarmor-tools/notion.sh \
            "${SOURCE_IMAGE}" \
            "${PYARMOR_IMAGE}" \
            "${CUDA_ARCH}" \
            "${CUDA_VERSION}" \
            "${CODE}"
